<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Excursions</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <style>
        body,
        h1,
        h2, p {
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            background: white;
            box-shadow: #a2b7ec 0 0 10px;
            padding: 10px;
            height: 40px;
            display: flex;
            align-items: center;
        }

        .header__link,
        .header__link:hover,
        .header__link:active,
        .header__link:visited {
            color: #5a2626;
            font-weight: 300;
            font-size: 24px;
            text-decoration: none;
        }

        .cover {
            height: 250px;
            width: 100%;
            object-fit: cover;
        }

        .content {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
    </style>
</head>
<body>
<header class="header">
    <a class="header__link" th:href="@{/excursions}">FollowMe</a>
</header>
<section class="content">
    <img class="cover" th:src="@{${excursion.imageUrl}}" />
    <h1 th:text="${excursion.title}">Open excursions</h1>
    <p th:text="${excursion.description}"></p>
</section>
</body>
</html>
