<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Excursions</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <style>
        body,
        h1,
        h2, p {
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            background: white;
            box-shadow: #a2b7ec 0 0 10px;
            padding: 10px;
            height: 40px;
            display: flex;
            align-items: center;
        }

        .header__link,
        .header__link:hover,
        .header__link:active,
        .header__link:visited {
            color: #5a2626;
            font-weight: 300;
            font-size: 24px;
            text-decoration: none;
        }

        .cover {
            height: 250px;
            width: 100%;
            object-fit: cover;
        }

        .content {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
    </style>
</head>
<body>
<header class="header">
    <a class="header__link" th:href="@{/excursions}">FollowMe</a>
</header>
<section class="content">
    <img class="cover" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/1_hallstatt_austria.jpg/1200px-1_hallstatt_austria.jpg"/>

    <form method="post">
        <div>
            <label for="title">Title</label>
            <input id="title" type="text" name="title" required/>
        </div>

        <div>
            <label for="description">Description</label>
            <textarea id="description" name="description" required></textarea>
        </div>

        <div>
            <label for="date">Date</label>
            <input id="date" type="date" name="date" required/>
        </div>

        <div>
            <button>Save</button>
        </div>
    </form>
</section>
</body>
</html>
