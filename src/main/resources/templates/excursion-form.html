<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Excursions</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <style>
        body,
        h1,
        h2, p {
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            background: white;
            box-shadow: #a2b7ec 0 0 10px;
            padding: 10px;
            height: 40px;
            display: flex;
            align-items: center;
        }

        .header__link,
        .header__link:hover,
        .header__link:active,
        .header__link:visited {
            color: #5a2626;
            font-weight: 300;
            font-size: 24px;
            text-decoration: none;
        }

        .cover {
            height: 250px;
            width: 100%;
            object-fit: cover;
        }

        .content {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form__label {
            font-size: 22px;
            display: flex
        }

        .form__actions {
            display: flex;
            justify-content: flex-end;
        }

        .form__save {
            background: #5a2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .form__input {
            width: 50%;
            padding: 5px 10px;
            border: 1px solid black;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 100;
        }

        .form__textarea {
            min-height: 150px;
            height: fit-content;
        }
    </style>
</head>
<body>
<header class="header">
    <a class="header__link" th:href="@{/excursions}">FollowMe</a>
</header>
<section class="content">
    <img class="cover" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/1_hallstatt_austria.jpg/1200px-1_hallstatt_austria.jpg"/>

    <form class="form" method="post">
        <h1>Add new excursion</h1>

        <div>
            <label class="form__label" for="title">Title</label>
            <input class="form__input" id="title" type="text" name="title" required/>
        </div>

        <div>
            <label class="form__label" for="description">Description</label>
            <textarea class="form__input form__textarea" id="description" name="description" required></textarea>
        </div>

        <div>
            <label class="form__label" for="date">Date</label>
            <input class="form__input" id="date" type="date" name="date" required/>
        </div>

        <div class="form__actions">
            <button class="form__save" type="submit">Save</button>
        </div>
    </form>
</section>
</body>
</html>
