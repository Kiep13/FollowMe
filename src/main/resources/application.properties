spring.application.name=FollowMe

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

spring.banner.location=classpath:banner.txt

spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false
spring.messages.encoding=UTF-8

spring.config.import=application-actuator.properties;application-log.properties
# Change database according to your needs
# Possible values: h2, postgres
# Invoices file exists only for making requests to the invoices ms
spring.profiles.active=dev,postgres,invoices